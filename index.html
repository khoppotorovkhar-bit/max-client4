<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MAX</title>
  
  <!-- Иконка для iPhone и Android -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    body { 
      margin: 0; 
      background: #000; 
      color: #fff;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow: hidden;
    }

    /* Экран заставки */
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    #splash img {
      width: 84px;
      height: 84px;
      border-radius: 20px;
    }
    .loader {
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #4da3ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Окно ошибки (скрыто в начале) */
    #error-box { 
      display: none;
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 14px; 
      width: 80%; 
      max-width: 310px; 
      text-align: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #aaa; margin-bottom: 20px; line-height: 1.4; }
    button { 
      background: #2c2c2e; 
      color: #4da3ff; 
      border: none; 
      padding: 11px; 
      width: 100%; 
      border-radius: 8px; 
      font-size: 15px; 
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- 1. Заставка при запуске -->
  <div id="splash">
    <img src="icon.png" alt="MAX" onerror="this.style.display='none'">
    <div class="loader"></div>
  </div>

  <!-- 2. Окно сбоя -->
  <div id="error-box">
    <div class="title">В приложении MAX произошел сбой</div>
    <div class="desc">Не удалось инициализировать сетевой модуль (Код ошибки: -1009). Повторите попытку позже.</div>
    <button onclick="closeApp()">Закрыть</button>
  </div>

  <script>
    // Через 1.5 секунды скрываем заставку и показываем ошибку
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('error-box').style.display = 'block';
    }, 1500);

    // Имитация закрытия (сворачивает в черный экран)
    function closeApp() {
      document.getElementById('error-box').style.display = 'none';
    }
  </script>

</body>
</html>
